# Tawzia , la plateforme RH par l'IA, conçue pour l'Algérie.
# Deux bleus (le bleu profond et le bleu clair du logo), de l'argile en relief
# sur un fond néomorphique, et le chiffre comme objet principal de chaque tuile. La palette vit dans core/brand.py ; ce fichier en
# est le reflet côté thème natif. Voir DESIGN.md.

[theme]
base = "light"
primaryColor = "#0B57A8"              # bleu de marque , actions, liens, actif
backgroundColor = "#E6ECF5"           # argile : fond et surfaces d'une même teinte
secondaryBackgroundColor = "#EEF3F9"  # surfaces d'argile
textColor = "#0F1B2D"
linkColor = "#0B57A8"
codeBackgroundColor = "#E6ECF5"
codeTextColor = "#0B3A6B"
borderColor = "#D5DEEA"               # la profondeur vient de la lumière, le filet aide l'œil
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "16px"                   # argile : des formes douces
buttonRadius = "16px"
linkUnderline = true

font = "'Manrope':https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
headingFont = "'Manrope':https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["30px", "21px", "17px", "15px", "14px", "13px"]
headingFontWeights = [800, 700, 700, 600, 600, 600]

# Séries de graphique : la famille de bleus de la marque d'abord, puis les
# couleurs sémantiques. Aucune ne signifie « marque » , elles signifient état.
chartCategoricalColors = ["#0B57A8", "#4E98E0", "#6CBEF5", "#0F6E4C", "#E4A13B", "#DE5B4F", "#6B21A8"]
chartSequentialColors = ["#F0F7FE", "#DDEDFC", "#C2DFFA", "#9FCDF6", "#6CBEF5", "#4E98E0", "#2A79C9", "#0B57A8", "#084684", "#062F58"]

# Palette sémantique : contrastes vérifiés sur fond blanc (>= 4.5:1).
blueColor = "#0B57A8"
greenColor = "#0F6E4C"
greenBackgroundColor = "#DDF5EA"
greenTextColor = "#0B5238"
orangeColor = "#8A5200"
orangeBackgroundColor = "#FDF0DA"
orangeTextColor = "#7A4800"
redColor = "#B3261E"
redBackgroundColor = "#FDECEC"
redTextColor = "#A32019"
violetColor = "#6B21A8"
yellowColor = "#8A6100"
grayColor = "#5A6B80"

dataframeBorderColor = "#D5DEEA"
dataframeHeaderBackgroundColor = "#E9EFF7"

[browser]
gatherUsageStats = false

[client]
# Le bouton « Deploy » ne doit pas couvrir la dalle du haut en démonstration.
toolbarMode = "minimal"

# WorkForce.dz , « le registre public algérien ».
# Slate ground, white surfaces, one trusted blue, visible 1px rules everywhere.
# No gradients: emphasis comes from weight, size and the navy. See DESIGN.md.
# Single light theme , the app is used at a desk and shown on a projector.

[theme]
base = "light"
primaryColor = "#1355C4"              # bleu d'action , boutons, liens, actif
backgroundColor = "#F1F5F9"           # fond ardoise : une carte blanche devient un objet
secondaryBackgroundColor = "#FFFFFF"  # surfaces , cartes, tableaux, champs
textColor = "#0F172A"
linkColor = "#0E42A0"
codeBackgroundColor = "#EEF2F7"
codeTextColor = "#0A2540"
borderColor = "#CBD5E1"               # bordure toujours visible, jamais suggérée
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"                    # équerré : un registre, pas une carte de visite
buttonRadius = "6px"
linkUnderline = true

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["32px", "22px", "17px", "15px", "14px", "13px"]
headingFontWeights = [800, 700, 700, 600, 600, 600]

# Séries de graphique : une famille de bleus qui se distinguent à distance, puis
# les couleurs sémantiques. Aucune ne signifie « marque » , elles signifient état.
chartCategoricalColors = ["#1355C4", "#0A2540", "#0E7490", "#047857", "#B45309", "#B91C1C", "#6B21A8"]
chartSequentialColors = ["#EEF4FD", "#D8E6FA", "#B6CFF4", "#8DB3EC", "#5F91E1", "#3B73D4", "#1355C4", "#0E42A0", "#0B3277", "#0A2540"]

# Palette sémantique : contrastes vérifiés sur fond blanc (>= 4.5:1).
blueColor = "#1355C4"
greenColor = "#047857"
greenBackgroundColor = "#DCFCE7"
greenTextColor = "#065F46"
orangeColor = "#B45309"
orangeBackgroundColor = "#FEF3C7"
orangeTextColor = "#92400E"
redColor = "#B91C1C"
redBackgroundColor = "#FEE2E2"
redTextColor = "#991B1B"
violetColor = "#6B21A8"
yellowColor = "#A16207"
grayColor = "#475569"

dataframeBorderColor = "#CBD5E1"
dataframeHeaderBackgroundColor = "#E7EDF5"

[browser]
gatherUsageStats = false
